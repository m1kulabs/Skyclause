# `bun run db:up`: the local Postgres 18 for dev and tests (TRD environments). SKYCLAUSE_DB_PORT moves the host port;
# the harness and scripts read the same variable (scripts/local.ts).
name: skyclause
services:
  postgres:
    # `up --build` keeps the old data directory, and docker/init.sql runs only on an empty one. A container that predates
    # the pg_partman 5.1.0 image fails 0004 with `permission denied to grant role "pg_read_all_data"`; recreate it:
    # docker compose -f packages/db/compose.yaml down -v && bun run db:up
    build: ./docker
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 127.0.0.1:${SKYCLAUSE_DB_PORT:-5432}:5432
    # Over TCP, so it passes only after init.sql, while the entrypoint's temporary server listens on the socket alone.
    healthcheck:
      test: ['CMD', 'pg_isready', '--host=127.0.0.1', '--username=migrator', '--dbname=skyclause']
      interval: 1s
      timeout: 3s
      retries: 60
