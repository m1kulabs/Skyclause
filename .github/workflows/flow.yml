# The approval-flow suite on its ephemeral stack (#194, TRD testing): Postgres 18 in the runner's own container, the
# checked-out web build and the worker harness, under `bun run test:e2e:flow`. checks.yml calls it on pull requests
# that touch its owners' paths; it runs nightly on main. Every row lives in the run's scratch database, never production.
name: flow

on:
  workflow_call:
  # 03:37 MYT, off the hour, when GitHub delays scheduled runs least.
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps --only-shell chromium
        working-directory: apps/web
      - run: bun run db:up
      - run: bun run test:e2e:flow
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-results-${{ github.run_id }}
          path: apps/web/test-results
          retention-days: 7
