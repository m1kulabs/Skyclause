# Rapid Rail fallback runner (#68). The Pi posts from home once #72 schedules it;
# until the Pi kill criterion fires, this workflow posts instead. It runs every
# 30 minutes from 12:00 to 23:30 MYT (04:00–15:30 UTC) while the
# RIDERSHIP_ON_ACTIONS repo variable is `true`, plus on demand with optional
# backfill dates. A non-ok pilot reply fails the job and the next run retries.
name: ridership

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Backfill start night YYYY-MM-DD; empty runs one scheduled attempt'
        required: false
        default: ''
      end:
        description: 'Backfill end night YYYY-MM-DD; empty ends at data_as_of'
        required: false
        default: ''
  schedule:
    - cron: '*/30 4-15 * * *'

permissions:
  contents: read

concurrency:
  group: ridership
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.RIDERSHIP_ON_ACTIONS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pilot/pi/.ridership-state.json
          key: ridership-state-${{ github.run_id }}
          restore-keys: ridership-state-
      - name: Post SP17 exits
        env:
          RUNNER: actions
          INGEST_URL: ${{ vars.INGEST_URL }}
          PI_TOKEN: ${{ secrets.PI_TOKEN }}
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            if [ -n "${{ inputs.end }}" ]; then
              bun pilot/pi/ridership-run.ts --backfill --start "${{ inputs.start }}" --end "${{ inputs.end }}"
            else
              bun pilot/pi/ridership-run.ts --backfill --start "${{ inputs.start }}"
            fi
          else
            bun pilot/pi/ridership-run.ts
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: pilot/pi/.ridership-state.json
          key: ridership-state-${{ github.run_id }}
