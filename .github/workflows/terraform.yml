name: terraform

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - infra/**
  workflow_dispatch:

permissions:
  contents: read

env:
  # hashicorp/setup-terraform isn't on the repository's action allow-list, so install by checksum.
  TF_VERSION: 1.17.1
  TF_SHA256: 4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061
  TF_IN_AUTOMATION: 'true'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for dir in infra/bootstrap infra/environments/production infra/aws; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Test the email role's policy
        run: terraform -chdir=infra/aws test
      - name: Test which units get the mail settings
        run: terraform -chdir=infra/environments/production test
      - name: Test the region check
        run: infra/scripts/check-region.test.sh

  freeze:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_FREEZE == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice::DEPLOY_FREEZE is true, so the production apply is skipped."

  apply:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_FREEZE != 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/environments/production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: skyclause-terraform@skyclause.iam.gserviceaccount.com
      - name: Read the Neon API key from Secret Manager
        run: |
          key="$(gcloud secrets versions access latest --secret=NEON_API_KEY --project=skyclause)"
          echo "::add-mask::$key"
          echo "NEON_API_KEY=$key" >> "$GITHUB_ENV"
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - name: Check every located resource is in Singapore
        run: |
          terraform show -json tfplan > plan.json
          ../../scripts/check-region plan.json
      - run: terraform apply -input=false tfplan
