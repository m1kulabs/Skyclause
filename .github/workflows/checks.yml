# P1 pull request checks (#86). #90's deploy workflow reuses every job through workflow_call.
# P0's own workflows cover pilot/ (D10).
name: checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      web: ${{ steps.paths.outputs.web }}
      apps-packages: ${{ steps.paths.outputs.apps-packages }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Outside a pull request (a workflow_call from a push), everything runs.
          if [ "$EVENT" != pull_request ]; then
            printf 'code=true\nweb=true\napps-packages=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false web=false apps_packages=false
          # The checkout is the PR's merge commit, so HEAD^1 is the base it merges into.
          while IFS= read -r file; do
            case "$file" in
              docs/* | pilot/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            case "$file" in apps/web/* | packages/*) web=true ;; esac
            case "$file" in apps/* | packages/*) apps_packages=true ;; esac
          done < <(git diff --name-only HEAD^1 HEAD)
          printf 'code=%s\nweb=%s\napps-packages=%s\n' "$code" "$web" "$apps_packages" | tee -a "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run db:up
      - run: bun run test

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps --only-shell chromium
        working-directory: apps/web
      - run: bun run test:e2e

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build

  openapi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run openapi:check

  seed-check:
    needs: changes
    if: needs.changes.outputs.apps-packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run db:seed-check

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # GHSA-g3hv-75wg-m249 covers minimatch 7.0.0 to below 11.0.1, so package.json overrides only typescript-estree's
      # minimatch ^10 to ^11.0.1; ESLint 9's ^3 is outside it. #214 drops the override once typescript-eslint has a fix.
      - run: bun audit

  # P0's gitleaks job (#48) is the secret scan; until it is on main this runs the pinned CLI (#215 removes it).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
