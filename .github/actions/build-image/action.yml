name: Build the image
description: Builds the one image (#90) for Cloud Run, checks it with scripts/check-image.sh and attaches its SBOM to the run.
inputs:
  tag:
    description: Local tag for the image.
    required: true
runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      # One single-platform manifest, no attestations, so the pushed digest is the image Cloud Run runs.
      run: docker build --platform linux/amd64 --provenance=false --tag "$TAG" .
    - name: Check the image
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: scripts/check-image.sh "$TAG"
    # anchore/sbom-action isn't on the repository's action allow-list, so install syft by checksum.
    - name: Write the SBOM
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        SYFT_VERSION: 1.57.0
        SYFT_SHA256: 9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704
      run: |
        archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"
        echo "${SYFT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" syft
        "$RUNNER_TEMP/syft" scan "docker:$TAG" -o "spdx-json=$RUNNER_TEMP/sbom.spdx.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-${{ github.sha }}
        path: ${{ runner.temp }}/sbom.spdx.json
        if-no-files-found: error
